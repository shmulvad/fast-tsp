[build-system]
# 1.14+ is needed to build abi3t (free-threaded stable ABI) wheels for 3.15+.
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "fast_tsp"
description = "A fast TSP solver with Python bindings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Soeren Mulvad", email = "shmulvad@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Optional: fast_tsp accepts plain lists, and reads integer numpy arrays
# directly when numpy is installed.
numpy = ["numpy>=1.0.0"]
test = ["pytest", "numpy"]
docs = ["sphinx", "sphinx-rtd-theme", "sphinx-autodoc-typehints"]

[project.urls]
Homepage = "https://github.com/shmulvad/fast-tsp"
Documentation = "https://fast-tsp.readthedocs.io"

[tool.maturin]
# Version comes from Cargo.toml. The Python package lives in python/fast_tsp
# and the compiled extension is installed as fast_tsp._core.
python-source = "python"
module-name = "fast_tsp._core"
features = ["python", "numpy"]

[tool.ruff]
preview = true
exclude = [
    ".git",
    "*.pyc"  ,
    "__pycache__",
]
lint.ignore = ["S101", "ANN101", "B904", "COM812", "E203"]
line-length = 127
# See https://beta.ruff.rs/docs/rules/ for more information
lint.select = [
    "C9",
    "E",
    "F",
    "W",
    "B",
    "I",
    "N",
    "UP",
    # "ANN",
    "A",
    "S",
    "COM",
    "C4",
    "ICN",
    "PIE",
    "Q",
    # "TCH",
    "PTH",
    "NPY",
    "RUF",
]
lint.ignore-init-module-imports = true
target-version = "py38"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.flake8-import-conventions]
[tool.ruff.lint.flake8-import-conventions.aliases]
constants = "const"

[tool.ruff.lint.isort]
force-single-line = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id", "type"]
