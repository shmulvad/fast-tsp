name: Wheels

# Builds prebuilt wheels so users never need a Rust toolchain, and publishes
# them to PyPI when a tag is pushed. Manual runs build and test every wheel as
# a dry run without publishing.
#
# Each platform gets three wheels:
#   cp310-abi3         stable ABI: CPython 3.10-3.14 (and later GIL builds)
#   cp314-cp314t       free-threaded CPython 3.14 (no stable ABI for it;
#                      not built for 32-bit Windows, which PyO3 does not
#                      support free-threaded before 3.15)
#   cp315-abi3.abi3t   free-threaded stable ABI (PEP 803): CPython 3.15+,
#                      both GIL and free-threaded builds
#
# Every build passes an explicit interpreter (-i). Without one, maturin picks
# the newest Python it finds, and with 3.15 present that yields only the
# 3.15+ wheel. The "Check wheel tags" step catches that.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Interpreters the wheels are tested on (uv python requests).
  TEST_PYTHONS: "3.10 3.14+gil 3.14t 3.15+gil 3.15t"

jobs:
  linux:
    name: Linux ${{ matrix.platform.target }} (${{ matrix.platform.manylinux }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@v6
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist -i python3.12
      - name: Build free-threaded 3.14 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist -i python3.14t
      - name: Build abi3t wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --out dist -i python3.15
      - name: Check wheel tags
        shell: bash
        run: .github/scripts/check-wheel-tags.sh dist
      - uses: astral-sh/setup-uv@v7
        if: matrix.platform.manylinux == '2_28'
      - name: Test wheels (glibc)
        if: matrix.platform.manylinux == '2_28'
        run: |
          # shellcheck disable=SC2086  # split the list into arguments
          .github/scripts/test-wheels.sh dist $TEST_PYTHONS
      - name: Test wheels (musl)
        if: matrix.platform.manylinux != '2_28'
        run: |
          docker run --rm -v "$PWD:/io" -w /io alpine:latest sh -c '
            set -e
            apk add --no-cache bash curl
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
            .github/scripts/test-wheels.sh dist '"$TEST_PYTHONS"'
          '
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}-${{ matrix.platform.manylinux }}
          path: dist/*.whl

  windows:
    name: Windows ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
            test_pythons: "3.10 3.14+gil 3.14t 3.15+gil 3.15t"
          - runner: windows-latest
            target: x86
            python_arch: x86
            # 32-bit interpreters on the 64-bit runner.
            test_pythons: "cpython-3.10-windows-x86 cpython-3.15-windows-x86 cpython-3.15+freethreaded-windows-x86"
            # PyO3 supports free-threading on 32-bit only from 3.15.
            check_args: --no-cp314t
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
            # No Python 3.10 builds or numpy wheels exist for Windows on ARM.
            test_pythons: "3.11 3.14t 3.15+gil 3.15t"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.12
      - uses: actions/setup-python@v6
        if: matrix.platform.target != 'x86'
        with:
          python-version: "3.14t"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build free-threaded 3.14 wheel
        if: matrix.platform.target != 'x86'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build abi3t wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.15
      - name: Check wheel tags
        shell: bash
        run: .github/scripts/check-wheel-tags.sh dist ${{ matrix.platform.check_args }}
      - uses: astral-sh/setup-uv@v7
      - name: Test wheels
        shell: bash
        run: .github/scripts/test-wheels.sh dist ${{ matrix.platform.test_pythons }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist/*.whl

  macos:
    name: macOS ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: |
            3.12
            3.14t
            3.15
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.12
      - name: Build free-threaded 3.14 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.14t
      - name: Build abi3t wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.15
      - name: Check wheel tags
        run: .github/scripts/check-wheel-tags.sh dist
      - uses: astral-sh/setup-uv@v7
      - name: Test wheels
        run: |
          # shellcheck disable=SC2086  # split the list into arguments
          .github/scripts/test-wheels.sh dist $TEST_PYTHONS
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist/*.whl

  sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Check metadata
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: astral-sh/setup-uv@v7
      # --check-url skips files already on PyPI, so a failed run can be re-run.
      - name: Publish
        run: uv publish --check-url https://pypi.org/simple/ dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
